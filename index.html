<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahmut & Kübra | Aşk Hikayemiz 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .container, .lock-screen {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
        }
        .hidden { display: none !important; }
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #e91e63;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
        }
        .lock-screen input {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            outline: none;
            width: 70%;
            margin-right: 10px;
            text-align: center;
        }
        .lock-screen button {
            padding: 12px 20px;
            font-size: 1rem;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .error-msg {
            color: #d32f2f;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .photo-gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .photo-gallery img {
            width: 100%;
            max-width: 260px;
            height: 320px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 3px solid #fff;
        }
        .music-box {
            background: #fff0f3;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #ffccd5;
        }
        .music-box p {
            font-size: 0.95rem;
            color: #d81b60;
            margin-bottom: 10px;
            font-weight: 600;
        }
        audio { width: 100%; outline: none; }
        .counter {
            display: flex;
            justify-content: space-around;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .time-box span {
            display: block;
            font-size: 1.5rem;
            font-weight: 600;
            color: #e91e63;
        }
        .time-box label { font-size: 0.8rem; color: #888; }
        .note { font-style: italic; color: #555; line-height: 1.6; }
        .heart {
            position: absolute;
            color: #e91e63;
            font-size: 20px;
            animation: flyUp 1.5s linear forwards;
            pointer-events: none;
        }
        @keyframes flyUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
